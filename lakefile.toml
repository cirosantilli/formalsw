  "lang.py.FormalSW.MemoCalls",
  "lang.py.FormalSW.MemoCallRules",
  "lang.py.FormalSW.MemoHeapCalls",
  "lang.py.FormalSW.Linking",
  "lang.py.FormalSW.Globals",
