# Lake package configuration for the Python-to-Lean AST framework.
name = "formalsw"
version = "0.3.0"
defaultTargets = ["FormalSW", "lang.py.FormalSW"]

# Umbrella module re-exporting installed language models.
[[lean_lib]]
name = "FormalSW"

# Language-specific models live below `lang/`.
[[lean_lib]]
name = "lang.py.FormalSW"
roots = [
  "lang.py.FormalSW.Model",
  "lang.py.FormalSW.Python",
  "lang.py.FormalSW.Execution",
  "lang.py.FormalSW.Runtime",
  "lang.py.FormalSW.Math",
  "lang.py.FormalSW.Strings",
  "lang.py.FormalSW.IntegerParsing",
  "lang.py.FormalSW.Calls",
  "lang.py.FormalSW.Linking",
  "lang.py.FormalSW.Globals",
  "lang.py.FormalSW.ScalarSets",
  "lang.py.FormalSW.ScalarSort",
  "lang.py.FormalSW.MutableGlobals",
  "lang.py.FormalSW.Instances",
  "lang.py.FormalSW.HeapCalls",
  "lang.py.FormalSW.SumCalls",
  "lang.py.FormalSW.ClassCalls",
  "lang.py.FormalSW.DataRuntime",
  "lang.py.FormalSW.GraphEquivalence",
  "lang.py.FormalSW.GraphPreservation",
  "lang.py.FormalSW.Sorting",
  "lang.py.FormalSW.Syntax",
  "lang.py.FormalSW.Parallel",
  "lang.py.FormalSW.ParallelLiveness",
  "lang.py.FormalSW.PyValue",
  "lang.py.FormalSW.Quotation",
  "lang.py.builtin.type.bool",
  "lang.py.builtin.type.bytearray",
  "lang.py.builtin.type.bytes",
  "lang.py.builtin.type.comparison",
  "lang.py.builtin.type.core",
  "lang.py.builtin.type.contextmanager",
  "lang.py.builtin.type.descriptor",
  "lang.py.builtin.type.dict",
  "lang.py.builtin.type.dictview",
  "lang.py.builtin.function",
  "lang.py.builtin.type.int",
  "lang.py.builtin.type.unicode",
  "lang.py.builtin.type.iterator",
  "lang.py.builtin.type.list",
  "lang.py.builtin.type.memoryview",
  "lang.py.builtin.type.object",
  "lang.py.builtin.type.range",
  "lang.py.builtin.type.sequence",
  "lang.py.builtin.type.set",
  "lang.py.builtin.type.slice",
  "lang.py.builtin.type.subsequence",
  "lang.py.builtin.type.str",
  "lang.py.builtin.type.special",
  "lang.py.builtin.type.super",
